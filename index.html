<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siyuu | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>
:root{
--grad:linear-gradient(135deg,#00dbde,#fc00ff);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#02020a;
color:white;
font-family:Poppins;
}

#particles-js{position:fixed;inset:0;z-index:-1}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}
.name{
font-family:Orbitron;
font-size:70px;
background:var(--grad);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:float 3s infinite;
}
@keyframes float{50%{transform:translateY(-15px)}}

/* SECTION */
.section{
max-width:1000px;
margin:100px auto;
padding:20px;
}
.card{
background:rgba(20,20,40,.75);
padding:30px;
border-radius:25px;
box-shadow:0 0 40px #00dbde88;
margin-bottom:40px;
}

/* SKILLS */
.skill{margin-bottom:18px}
.bar{
height:14px;
background:#111;
border-radius:20px;
overflow:hidden;
}
.fill{
height:100%;
width:0;
background:var(--grad);
box-shadow:0 0 20px #00dbde;
transition:2s;
}

/* PROJECTS */
.projects{
display:flex;
gap:20px;
overflow-x:auto;
}
.project{
min-width:240px;
padding:22px;
border-radius:20px;
background:#14142a;
box-shadow:0 0 25px #00dbde66;
transition:.4s;
text-align:center;
}
.project:hover{transform:scale(1.12)}

</style>
</head>
<body>

<div id="particles-js"></div>

<section class="hero">
<div class="name">SIYUU</div>
</section>

<section class="section">

<div class="card">
<h2>Skills</h2>

<div class="skill">JavaScript<div class="bar"><div class="fill" data="90%"></div></div></div>
<div class="skill">Node.js<div class="bar"><div class="fill" data="85%"></div></div></div>
<div class="skill">HTML & CSS<div class="bar"><div class="fill" data="80%"></div></div></div>

</div>

<div class="card">
<h2>Projects</h2>
<div class="projects">
<div class="project">Messenger GoatBot</div>
<div class="project">GoatBot Dev</div>
<div class="project">Instagram GoatBot</div>
<div class="project">API System</div>
</div>
</div>

</section>

<script>

particlesJS("particles-js",{
particles:{
number:{value:90},
color:{value:"#00dbde"},
move:{speed:2},
line_linked:{enable:true,color:"#00dbde"}
}
});

/* SKILL ANIMATION */
document.querySelectorAll(".fill").forEach(bar=>{
setTimeout(()=>{
bar.style.width=bar.getAttribute("data");
},800);
});

</script>

</body>
</html>
