<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anita ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body{
    margin:0;
    font-family:Poppins;
    background:#0f0f0f;
    color:white;
    overflow:hidden;
}

/* Pages */
.page{
    position:absolute;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* First Page */
#page1{
    background:linear-gradient(135deg,#1a1a1a,#2a2a2a);
}

/* Second Page */
#page2{
    background:black;
    transform:translateY(100%);
}

/* Title */
.title{
    font-family: 'Playfair Display';
    font-size:3.5rem;
    letter-spacing:2px;
}

/* Glow */
.glow{
    text-shadow:0 0 10px rgba(255,100,150,0.6);
}

/* Subtitle */
.sub{
    opacity:0.7;
    margin-top:10px;
}

/* Card */
.card{
    margin-top:30px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    max-width:400px;
}

/* Button */
.btn{
    margin-top:30px;
    padding:14px 35px;
    border-radius:50px;
    border:none;
    background:#ff4d6d;
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}
.btn:hover{
    transform:scale(1.05);
}

/* Corner */
.corner{
    position:fixed;
    bottom:10px;
    right:15px;
    font-size:13px;
    opacity:0.6;
}

/* Hold text */
#holdText{
    position:absolute;
    bottom:80px;
    opacity:0;
    font-size:1.5rem;
    color:#ff4d6d;
}

/* Floating soft particles */
.particle{
    position:absolute;
    width:6px;
    height:6px;
    background:#ff4d6d;
    border-radius:50%;
    opacity:0.3;
    animation:float 10s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page">
    <div class="title glow">Anita</div>
    <div class="sub">You feel like peace.</div>

    <div class="card">
        <p>
            Amar jibone tomar jayga sob somoy full thakbe…  
            kono percent diye measure kora jai na 💖
        </p>
    </div>

    <button class="btn" onclick="goNext()">Continue</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page">

    <div class="title glow">Black Love</div>

    <div class="card">
        <p>
            Anita, tumi amar moner shanti…<br>
            tumi amar shobcheye soft feeling ❤️<br><br>
            Kono show-off na… sudhu ekta kotha—  
            tumi thaklei sob thik lage.
        </p>
    </div>

    <div class="title glow" style="font-size:2.5rem;margin-top:30px;">
        I LOVE YOU
    </div>

    <div id="holdText">I Love You 💞</div>

</div>

<div class="corner">Siyam + Anita</div>

<script>

// Smooth intro
gsap.from(".title",{y:-40,opacity:0,duration:1.5});
gsap.from(".card",{opacity:0,y:30,duration:1,delay:0.5});

// Page switch
function goNext(){
    gsap.to("#page1",{y:"-100%",duration:1});
    gsap.to("#page2",{y:"0%",duration:1});
}

// Soft particles
setInterval(()=>{
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"vw";
    document.body.appendChild(p);

    setTimeout(()=>p.remove(),10000);
},500);

// HOLD EFFECT
let holdTimer;
const holdText=document.getElementById("holdText");

document.body.addEventListener("mousedown",()=>{
    holdTimer=setTimeout(()=>{
        gsap.to(holdText,{opacity:1,y:-20,duration:0.5});
    },600);
});

document.body.addEventListener("mouseup",()=>{
    clearTimeout(holdTimer);
    gsap.to(holdText,{opacity:0,y:0,duration:0.5});
});

// Mobile support
document.body.addEventListener("touchstart",()=>{
    holdTimer=setTimeout(()=>{
        gsap.to(holdText,{opacity:1,y:-20,duration:0.5});
    },600);
});

document.body.addEventListener("touchend",()=>{
    clearTimeout(holdTimer);
    gsap.to(holdText,{opacity:0,y:0,duration:0.5});
});

</script>

</body>
</html>
