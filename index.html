<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anita ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body{
    margin:0;
    font-family:Poppins;
    overflow:hidden;
}

/* Page 1 */
#page1{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#fff0f3,#ffe5ec);
}

/* Page 2 */
#page2{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    transform:translateY(100%);
}

/* Title */
h1{
    font-family:'Dancing Script';
    font-size:4rem;
    color:#ff4d6d;
}

/* Button */
.btn{
    padding:15px 40px;
    border:none;
    border-radius:50px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
}

/* Corner */
.corner{
    position:fixed;
    bottom:10px;
    right:15px;
    color:#ff4d6d;
}

/* Glow */
.glow{
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 10px red;}
    to{ text-shadow:0 0 30px pink;}
}

/* Floating hearts */
.heart{
    position:absolute;
    font-size:20px;
    animation:float 5s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh);}
    100%{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
    <h1 id="title">Anita 💖</h1>
    <p>You are my everything</p>

    <h2 id="counter">0%</h2>
    <p>Amar jibone tomar jayga sob somoy 100% thakbe ❤️</p>

    <button class="btn" onclick="showLove()">Click for Magic ✨</button>
</div>

<!-- PAGE 2 -->
<div id="page2">
    <h1 class="glow">Black Love 😘</h1>

    <p style="max-width:500px;text-align:center;font-size:1.4rem;">
        Anita, tumi amar moner shanti ❤️ <br>
        Tumi amar sopno, amar sob kichu 💖 <br>
        Tumi chara ami kichui na...
    </p>

    <h1 class="glow">I LOVE YOU 💞</h1>
</div>

<div class="corner">Siyam + Anita 💖</div>

<script>

// Title animation
gsap.from("#title",{y:-50,opacity:0,duration:1.5});

// Counter
let count=0;
let int=setInterval(()=>{
    if(count>=100) clearInterval(int);
    document.getElementById("counter").innerHTML=count+"%";
    count++;
},20);

// Floating hearts
setInterval(()=>{
    let h=document.createElement("div");
    h.innerHTML="❤️";
    h.className="heart";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);

    setTimeout(()=>h.remove(),5000);
},300);

// Page switch animation
function showLove(){
    gsap.to("#page1",{y:"-100%",duration:1});
    gsap.to("#page2",{y:"0%",duration:1});

    // extra hearts burst
    for(let i=0;i<20;i++){
        let h=document.createElement("div");
        h.innerHTML="💖";
        h.style.position="fixed";
        h.style.left="50%";
        h.style.top="50%";
        h.style.fontSize="20px";
        document.body.appendChild(h);

        gsap.to(h,{
            x:(Math.random()-0.5)*500,
            y:(Math.random()-0.5)*500,
            opacity:0,
            duration:2,
            onComplete:()=>h.remove()
        });
    }
}

</script>

</body>
</html>
