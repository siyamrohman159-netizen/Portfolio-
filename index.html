<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siyuu | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<style>
:root{
--grad:linear-gradient(135deg,#00dbde,#fc00ff);
--red:#ff1b1b;
}
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#02020a;
color:white;
font-family:Poppins;
overflow-x:hidden;
}

#particles-js{position:fixed;inset:0;z-index:-1}

/* LOADER */
#loader{
position:fixed;
inset:0;
background:#02020a;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:9999;
}
.ring{
width:140px;height:140px;
border-radius:50%;
border:6px solid transparent;
border-top:6px solid #00dbde;
border-right:6px solid #fc00ff;
animation:spin 1s linear infinite;
box-shadow:0 0 40px #00dbde;
}
#loadPercent{
margin-top:20px;
font-size:34px;
font-family:Orbitron;
color:#00dbde;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loader.hide{opacity:0;pointer-events:none;transition:1s}

/* HERO */
.hero{
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}
.hero img{
width:220px;
border-radius:50%;
padding:6px;
background:var(--grad);
box-shadow:0 0 40px #00dbde;
}
.logo{
font-family:Orbitron;
font-size:70px;
margin-top:20px;
background:var(--grad);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:float 3s infinite;
}
@keyframes float{50%{transform:translateY(-15px)}}

/* BLOODY NAME */
.bloody-name{
margin-top:12px;
font-size:34px;
font-weight:900;
letter-spacing:2px;
color:var(--red);
text-shadow:0 0 15px red,0 0 50px darkred;
position:relative;
animation:pulse 2s infinite;
}
.bloody-name:after{
content:"";
position:absolute;
left:10%;
top:100%;
width:4px;height:18px;
background:var(--red);
box-shadow:40px 10px red,90px 16px red,150px 8px red,210px 15px red;
animation:drip 2s infinite;
}
@keyframes drip{50%{height:25px}}
@keyframes pulse{50%{text-shadow:0 0 30px red,0 0 80px darkred}}

/* SECTIONS */
.section{
max-width:1100px;
margin:90px auto;
padding:20px;
}
.card{
background:rgba(25,25,45,.75);
padding:35px;
border-radius:25px;
box-shadow:0 0 40px #00dbde88;
margin-bottom:45px;
}
.card h2{
font-family:Orbitron;
background:var(--grad);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin-bottom:20px;
}

/* SKILLS */
.skill{margin-bottom:18px}
.bar{
height:14px;
background:#111;
border-radius:20px;
overflow:hidden;
}
.fill{
height:100%;
width:0;
background:var(--grad);
box-shadow:0 0 20px #00dbde;
transition:2s;
}

/* PROJECTS */
.projects{
display:flex;
gap:25px;
overflow-x:auto;
}
.project{
min-width:260px;
padding:25px;
border-radius:20px;
background:#14142a;
box-shadow:0 0 25px #00dbde66;
transition:.4s;
text-align:center;
cursor:pointer;
font-weight:600;
}
.project:hover{transform:scale(1.12)}

/* CONTACT */
.contact{
display:flex;
justify-content:center;
gap:22px;
margin-top:30px;
}
.contact a{
width:70px;height:70px;
border-radius:18px;
background:var(--grad);
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
color:white;
box-shadow:0 0 30px #00dbde;
transition:.4s;
}
.contact a:hover{transform:scale(1.2)}

/* MUSIC BTN */
#musicBtn{
position:fixed;
right:20px;
bottom:20px;
width:65px;height:65px;
border-radius:50%;
background:var(--grad);
border:none;
color:white;
font-size:26px;
cursor:pointer;
box-shadow:0 0 30px #00dbde;
}

</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
<div class="ring"></div>
<div id="loadPercent">0%</div>
</div>

<div id="particles-js"></div>

<section class="hero">
<img src="https://i.imgur.com/guUKCj0.jpeg">
<div class="logo">SIYUU</div>
<div class="bloody-name">SHAHARIYA AHMMED SIYAM (SIYUUU)</div>
</section>

<section class="section">

<div class="card">
<h2>About Me</h2>
<p>I develop Messenger bots, automation systems and modern web interfaces using Node.js and frontend technologies.</p>
</div>

<div class="card">
<h2>Skills</h2>
<div class="skill">JavaScript<div class="bar"><div class="fill" data="90%"></div></div></div>
<div class="skill">Node.js<div class="bar"><div class="fill" data="85%"></div></div></div>
<div class="skill">HTML & CSS<div class="bar"><div class="fill" data="80%"></div></div></div>
</div>

<div class="card">
<h2>Projects</h2>
<div class="projects">

<div class="project" onclick="openLink('https://github.com/siyuuu-x1/main_goatbot_v2')">Messenger GoatBot</div>
<div class="project">GoatBot Dev</div>
<div class="project" onclick="openLink('https://github.com/siyuuu-x1/Insta-chatbot-v2')">Instagram GoatBot</div>
<div class="project">API System</div>

</div>
</div>

<div class="card">
<h2>Contact</h2>
<div class="contact">
<a href="https://www.facebook.com/share/1Cu1TC1D5h/"><i class="fab fa-facebook-f"></i></a>
<a href="https://m.me/siyuuuuuuuuuuuuuu"><i class="fab fa-facebook-messenger"></i></a>
<a href="https://github.com/siyuuu-x1"><i class="fab fa-github"></i></a>
<a href="https://www.instagram.com/siyuu_0.01"><i class="fab fa-instagram"></i></a>
</div>
</div>

</section>

<audio id="bgMusic" loop>
<source src="https://i.imgur.com/NqMmnL7.mp4">
</audio>
<button id="musicBtn"><i class="fa fa-music"></i></button>

<script>

/* LOADER */
let p=0;
const percent=document.getElementById("loadPercent");
const loader=document.getElementById("loader");
const load=setInterval(()=>{
p+=Math.floor(Math.random()*4)+1;
if(p>=100){
p=100;
clearInterval(load);
setTimeout(()=>loader.classList.add("hide"),500);
}
percent.innerText=p+"%";
},40);

/* PARTICLES */
particlesJS("particles-js",{
particles:{
number:{value:90},
color:{value:"#00dbde"},
move:{speed:2},
line_linked:{enable:true,color:"#00dbde"}
}
});

/* SKILLS */
document.querySelectorAll(".fill").forEach(bar=>{
setTimeout(()=>bar.style.width=bar.getAttribute("data"),800);
});

function openLink(url){
window.open(url,"_blank");
}

/* MUSIC */
const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");
let playing=false;

document.body.addEventListener("click",()=>{
if(!playing){music.play();playing=true;}
});

btn.onclick=(e)=>{
e.stopPropagation();
playing?music.pause():music.play();
playing=!playing;
};

</script>

</body>
</html>
