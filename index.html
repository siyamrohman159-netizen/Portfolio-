<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Nikita anita ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ffccd5;
            --dark: #590d22;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fff0f3;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: var(--dark);
        }

        /* Floating Hearts Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: var(--primary);
            margin: 0;
            opacity: 0;
        }

        .sub-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
        }

        /* Love Meter Section */
        .section {
            padding: 100px 20px;
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.2);
            margin-bottom: 50px;
            transform: translateY(50px);
            opacity: 0;
        }

        .love-percent {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* Heart Animation */
        .heart-loader {
            position: relative;
            width: 100px;
            height: 90px;
            margin: 20px auto;
        }

        .heart-loader::before,
        .heart-loader::after {
            content: "";
            position: absolute;
            top: 0;
            width: 52px;
            height: 80px;
            border-radius: 50px 50px 0 0;
            background: var(--primary);
        }

        .heart-loader::before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart-loader::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* Button */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .btn:hover {
            transform: scale(1.1);
            background: #c9184a;
        }

        footer {
            padding: 40px;
            font-size: 0.9rem;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <section class="hero">
        <h1 id="main-title">anita</h1>
        <p class="sub-text">You are my whole world</p>
        <div class="heart-loader"></div>
    </section>

    <section class="section">
        <div class="card" id="love-card">
            <h2>Love Percentage for You</h2>
            <div class="love-percent" id="counter">0%</div>
            <p>Amar jibone tomar jayga sob somoy 100% thakbe.</p>
        </div>

        <div class="card" id="message-card">
            <h3>Kichu Kotha...</h3>
            <p>"anita, tumi jano na tumi amar kache koto special. Ei chotto website-ta sudhu tomar smile-er jonne banano."</p>
            <button class="btn" onclick="sayLove()">Click for Magic</button>
        </div>
    </section>

    <footer align="center">
        Made with ❤️ for anita
    </footer>

    <script>
        // GSAP Animations
        window.onload = () => {
            const tl = gsap.timeline();

            tl.to("#main-title", { opacity: 1, y: -20, duration: 1.5, ease: "power4.out" })
              .to(".sub-text", { opacity: 1, duration: 1 }, "-=0.5")
              .to(".heart-loader", { scale: 1.2, repeat: -1, yoyo: true, duration: 0.6 });

            // Scroll Trigger Animation (Simple)
            window.addEventListener('scroll', () => {
                const cards = document.querySelectorAll('.card');
                cards.forEach(card => {
                    const cardTop = card.getBoundingClientRect().top;
                    if(cardTop < window.innerHeight - 100) {
                        gsap.to(card, { opacity: 1, y: 0, duration: 1, ease: "back.out(1.7)" });
                    }
                });
                
                // Love counter animation
                if(document.getElementById('love-card').style.opacity == 1) {
                    animateValue("counter", 0, 100, 2000);
                }
            });
        };

        // Love Counter Function
        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            if (obj.innerHTML !== "0%") return; // Prevent restart
            
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start) + "%";
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Magic Button Interaction
        function sayLove() {
            alert("Nikita anita, I Love You More Than Anything! 💖");
            for(let i=0; i<15; i++) {
                createHeart();
            }
        }

        // Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.style.position = 'fixed';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            heart.style.zIndex = '1000';
            heart.style.pointerEvents = 'none';
            document.body.appendChild(heart);

            gsap.to(heart, {
                y: -window.innerHeight - 100,
                x: (Math.random() - 0.5) * 200,
                opacity: 0,
                duration: 2 + Math.random() * 2,
                onComplete: () => heart.remove()
            });
        }
    </script>
</body>
</html>
