<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL API</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  background:#000;
  color:#fff;
  font-family:Poppins;
  padding:30px;
}

h1{font-family:Creepster;color:red;text-align:center;margin-bottom:30px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}

.card{
  background:#0a0a0a;
  border:1px solid #300;
  padding:15px;
  border-radius:10px;
  transition:.3s;
}
.card:hover{transform:scale(1.05);box-shadow:0 0 10px red}

.name{color:#ff4d4d}
.link{font-size:12px;color:#aaa;word-break:break-all}

button{margin-top:10px;padding:6px 12px;background:red;border:none;color:#fff;cursor:pointer;border-radius:5px}

.back{position:fixed;top:20px;left:20px;background:red;padding:8px 15px;cursor:pointer}
</style>
</head>

<body>

<div class="back" onclick="goBack()">⬅ Back</div>
<h1>🔥 ALL API 🔥</h1>
<div class="grid" id="api"></div>

<script>
const apiData={
  anisearch:"https://xalman-anisearch-apis-s5yv.onrender.com",
  album:"https://nx-album-apix.onrender.com",
  font:"https://xalman-font-apis-dbv8.onrender.com",
  cdp:"https://nx-cdp-apis-cqss.onrender.com",
  quiz:"https://xalman-quiz-apis-6s9k.onrender.com",
  math:"https://xalman-mathgame-apis.onrender.com",
  meme:"https://nx-meme-apis.onrender.com",
  autodl:"https://xalman-autodl-apis.onrender.com",
  tikdl:"https://xalman-tikdl.onrender.com",
  lyrics:"https://xalman-lyrics-apis.onrender.com",
  flux:"https://xalman-flux-apis.onrender.com",
  rbg:"https://xalman-removebg-apis.onrender.com",
  "4k":"https://xalman-4k-apis.onrender.com",
  imgbb:"https://xalman-imgbb-apis-8qnx.onrender.com",
  freeimg:"https://xalman-freeimageupload-apis.onrender.com",
  catbox:"https://xalman-catbox-apis.onrender.com",
  ss:"https://xalman-screenshot-apis.onrender.com",
  trans:"https://xalman-translate-apis.onrender.com",
  mixmean:"https://xalman-emojimean-and-mix.onrender.com",
  tm:"https://xalman-tempmail-apis.onrender.com",
  chat:"https://xalman-aichat-apis.onrender.com",
  pin:"https://xalman-pinterest-apis.onrender.com",
  bomb:"https://xalman-bomber-jsaz.onrender.com",
  prompt:"https://xalman-prompt-apis.onrender.com"
};

const container=document.getElementById("api");
for(let key in apiData){
  let div=document.createElement("div");
  div.className="card";
  div.innerHTML=`<div class="name">${key}</div>
  <div class="link">${apiData[key]}</div>
  <button onclick="copyAPI('${key}')">Copy</button>`;
  container.appendChild(div);
}

function copyAPI(id){navigator.clipboard.writeText(apiData[id]);alert("Copied: "+id)}
function goBack(){window.location.href="index.html"}
</script>

</body>
</html>
